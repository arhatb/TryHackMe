  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #080b10;
      --bg2:      #0d1117;
      --bg3:      #161b22;
      --border:   rgba(48,54,61,0.8);
      --green:    #39d353;
      --green2:   #26a641;
      --cyan:     #58a6ff;
      --purple:   #bc8cff;
      --yellow:   #e3b341;
      --red:      #f85149;
      --orange:   #f0883e;
      --text:     #e6edf3;
      --text2:    #8b949e;
      --text3:    #484f58;
      --mono:     'JetBrains Mono', monospace;
      --cursor-color: #39d353;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; }

    body {
      background: var(--bg);
      font-family: var(--mono);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── TITLE BAR ── */
    .titlebar {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      user-select: none;
    }

    .tb-dots { display:flex; gap:7px; }
    .tb-dot {
      width:12px; height:12px; border-radius:50%;
      cursor:pointer; transition: opacity 0.2s;
    }
    .tb-dot:hover { opacity:0.75; }
    .tb-dot.red    { background:#ff5f57; }
    .tb-dot.yellow { background:#febc2e; }
    .tb-dot.green  { background:#28c840; }

    .tb-title {
      flex:1; text-align:center;
      font-size:12px; color:var(--text2);
      letter-spacing:0.05em;
    }

    .tb-lang {
      font-size:11px; color:var(--cyan);
      cursor:pointer; padding:3px 8px;
      border:1px solid rgba(88,166,255,0.25);
      border-radius:4px;
      transition: all 0.2s;
      background: rgba(88,166,255,0.05);
    }
    .tb-lang:hover { background:rgba(88,166,255,0.15); color:#fff; }

    /* ── TERMINAL BODY ── */
    #terminal {
      flex:1;
      overflow-y: auto;
      padding: 20px 24px 8px;
      scroll-behavior: smooth;
    }

    #terminal::-webkit-scrollbar { width:6px; }
    #terminal::-webkit-scrollbar-track { background:transparent; }
    #terminal::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:3px; }

    .output-line {
      line-height: 1.6;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output-line.cmd   { color: var(--green); }
    .output-line.info  { color: var(--text2); }
    .output-line.dim   { color: var(--text3); }
    .output-line.error { color: var(--red); }
    .output-line.success { color: var(--green); }
    .output-line.accent  { color: var(--cyan); }
    .output-line.warn    { color: var(--yellow); }
    .output-line.purple  { color: var(--purple); }
    .output-line.orange  { color: var(--orange); }
    .output-line.gap { margin-bottom:6px; }

    .prompt-line {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 13px;
      margin-top: 4px;
    }

    .prompt-user  { color: var(--green); }
    .prompt-at    { color: var(--text2); }
    .prompt-host  { color: var(--cyan); }
    .prompt-sep   { color: var(--text2); }
    .prompt-path  { color: var(--purple); }
    .prompt-arrow { color: var(--text2); margin-right:8px; }

    #input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      flex:1;
      caret-color: var(--cursor-color);
    }

    .input-row {
      display: flex;
      align-items: center;
      padding: 4px 24px 16px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }

    /* ── HANGMAN ── */
    .hangman-art {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.4;
      color: var(--yellow);
      margin: 4px 0;
    }

    .hm-word {
      font-size: 16px;
      letter-spacing: 8px;
      color: var(--text);
      margin: 8px 0 4px;
    }

    .hm-wrong {
      color: var(--red);
      font-size: 12px;
    }

    /* ── BOOT ANIMATION ── */
    @keyframes blink {
      0%,100% { opacity:1; }
      50%      { opacity:0; }
    }
    .blink { animation: blink 1s infinite; }

    /* ── MOBILE ── */
    @media (max-width:600px) {
      #terminal { padding:12px 14px 6px; }
      .input-row { padding:4px 14px 12px; }
      .output-line { font-size:12px; }
      #input { font-size:12px; }
      .prompt-line { font-size:12px; }
      .tb-title { font-size:11px; }
    }
  </style>
</head>

function print(text, type='info') {
  const d = document.createElement('div');
  d.className = 'output-line ' + type;
  d.textContent = text;
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
}

function printLines(lines) {
  lines.forEach(l => {
    if (l.rest !== undefined) {
      // two-tone line
      const d = document.createElement('div');
      d.className = 'output-line';
      const s1 = document.createElement('span');
      s1.className = l.t === 'green2' ? 'success' : l.t;
      s1.style.color = l.t === 'green2' ? 'var(--green)' : '';
      s1.textContent = l.s;
      const s2 = document.createElement('span');
      s2.className = 'info';
      s2.textContent = l.rest;
      d.appendChild(s1);
      d.appendChild(s2);
      term.appendChild(d);
    } else {
      const cls = l.t === 'green2' ? 'success' : l.t === 'text3' ? 'dim' : l.t;
      print(l.s, cls);
    }
  });
  term.scrollTop = term.scrollHeight;
}

function printCmd(cmd) {
  const row = document.createElement('div');
  row.className = 'prompt-line output-line';
  row.style.marginTop = '10px';
  row.innerHTML = `<span class="prompt-user">arhat</span><span class="prompt-at">@</span><span class="prompt-host">portfolio</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span class="prompt-arrow"> $ </span><span style="color:var(--text)">${cmd}</span>`;
  term.appendChild(row);
  term.scrollTop = term.scrollHeight;
}

function gap() { print(''); }

// ─────────────────────────────────────────
//  MATRIX EFFECT
// ─────────────────────────────────────────
function doMatrix() {
  const chars = 'アイウエオカキクケコ0123456789ABCDEF';
  let count = 0;
  const id = setInterval(() => {
    let line = '  ';
    for (let i = 0; i < 40; i++) line += chars[Math.floor(Math.random() * chars.length)];
    const d = document.createElement('div');
    d.className = 'output-line';
    d.style.color = `hsl(${120 + Math.random()*20}, 100%, ${30 + Math.random()*40}%)`;
    d.textContent = line;
    term.appendChild(d);
    term.scrollTop = term.scrollHeight;
    count++;
    if (count > 18) {
      clearInterval(id);
      gap();
      print(lang === 'tr' ? "  Matrix bitti. Hoş geldin, Neo." : "  Matrix ended. Welcome, Neo.", 'success');
      gap();
    }
  }, 60);
}

// ─────────────────────────────────────────
//  HANGMAN
// ─────────────────────────────────────────
function startHangman() {
  const words = HM_WORDS[lang];
  const word = words[Math.floor(Math.random() * words.length)];
  hangman = { word, guessed: [], wrong: [], maxWrong: 6 };
  gap();
  print(T[lang].hm_start, 'purple');
  gap();
  renderHangman();
}

function renderHangman() {
  if (!hangman) return;
  const { word, guessed, wrong, maxWrong } = hangman;
  // art
  const artLines = HM_ART[wrong.length].split('\n');
  artLines.forEach(l => {
    const d = document.createElement('div');
    d.className = 'hangman-art output-line';
    d.textContent = l;
    term.appendChild(d);
  });
  // word display
  const display = word.split('').map(c => guessed.includes(c) ? c : '_').join(' ');
  const wd = document.createElement('div');
  wd.className = 'hm-word output-line';
  wd.textContent = '  ' + display;
  term.appendChild(wd);
  // wrong letters
  const wl = document.createElement('div');
  wl.className = 'hm-wrong output-line';
  wl.textContent = T[lang].hm_guess(display, wrong.join(' ') || '-', maxWrong - wrong.length);
  term.appendChild(wl);
  term.scrollTop = term.scrollHeight;
}

function guessLetter(letter) {
  if (!hangman) { print(T[lang].hm_none, 'error'); return; }
  letter = letter.toUpperCase();
  if (letter.length !== 1 || !/[A-ZÇĞİÖŞÜ]/.test(letter)) {
    print(T[lang].hm_invalid, 'error'); return;
  }
  if (hangman.guessed.includes(letter) || hangman.wrong.includes(letter)) {
    print(T[lang].hm_already(letter), 'warn'); return;
  }
  if (hangman.word.includes(letter)) {
    hangman.guessed.push(letter);
  } else {
    hangman.wrong.push(letter);
  }
  gap();
  const { word, guessed, wrong, maxWrong } = hangman;
  const won  = word.split('').every(c => guessed.includes(c));
  const lost = wrong.length >= maxWrong;
  if (won) {
    renderHangman();
    gap();
    print(T[lang].hm_win(word), 'success');
    hangman = null;
  } else if (lost) {
    renderHangman();
    gap();
    print(T[lang].hm_lose(word), 'error');
    hangman = null;
  } else {
    renderHangman();
  }
  gap();
}

// ─────────────────────────────────────────
//  COMMAND PROCESSOR
// ─────────────────────────────────────────
function run(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;

  printCmd(raw.trim());

  // hangman letter guess mode
  if (hangman && cmd.length === 1) {
    guessLetter(cmd);
    return;
  }

  gap();
  switch(cmd) {
    case 'help':
      printLines(T[lang].help); break;
    case 'about':
      printLines(T[lang].about); break;
    case 'skills':
      printLines(T[lang].skills); break;
    case 'projects':
      printLines(T[lang].projects); break;
    case 'contact':
      printLines(T[lang].contact); break;
    case 'experience':
    case 'exp':
      printLines(T[lang].experience); break;
    case 'clear':
      term.innerHTML = '';
      print(T[lang].cleared, 'dim');
      break;
    case 'lang':
      lang = lang === 'tr' ? 'en' : 'tr';
      document.getElementById('langToggle').textContent = lang === 'tr' ? 'EN' : 'TR';
      print(T[lang].lang_switched, 'success');
      break;
    case 'hangman':
      startHangman(); break;
    case 'matrix':
      doMatrix(); break;
    case 'secret':
    case 'sudo':
    case 'hack':
      printLines(T[lang].secret); break;
    case 'whoami':
      print('  arhat', 'green'); break;
    case 'pwd':
      print('  /home/arhat/portfolio', 'info'); break;
    case 'ls':
      print('  about.txt  skills.json  projects/  contact.md  secret.exe', 'info'); break;
    case 'uname':
    case 'uname -a':
      print('  ARHAT-OS 2026.1 portfolio-kernel #1 SMP Thu May 2026', 'info'); break;
    case 'date':
      print('  ' + new Date().toLocaleString(lang === 'tr' ? 'tr-TR' : 'en-US'), 'info'); break;
    case 'hello':
    case 'hi':
    case 'merhaba':
      print(lang === 'tr' ? '  Merhaba! 👋  help yazarak başlayabilirsin.' : "  Hello! 👋  Type 'help' to get started.", 'success'); break;
    case 'exit':
    case 'quit':
      print(lang === 'tr' ? '  Bu kadar kolay çıkamazsın. 😄' : "  You can't leave that easily. 😄", 'warn'); break;
    default:
      print(T[lang].notfound(raw.trim()), 'error');
  }
  gap();
}

// ─────────────────────────────────────────
//  LANG TOGGLE (titlebar button)
// ─────────────────────────────────────────
function toggleLang() {
  run('lang');
}

// ─────────────────────────────────────────
//  INPUT HANDLING
// ─────────────────────────────────────────
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = inp.value;
    inp.value = '';
    if (val.trim()) { history.unshift(val); histIdx = -1; }
    run(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; inp.value = history[histIdx]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; inp.value = history[histIdx]; }
    else { histIdx = -1; inp.value = ''; }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const cmds = ['help','about','skills','projects','contact','experience','hangman','matrix','secret','clear','lang'];
    const partial = inp.value.toLowerCase();
    const match = cmds.find(c => c.startsWith(partial));
    if (match) inp.value = match;
  }
});

// click anywhere to focus
document.addEventListener('click', () => inp.focus());

// ─────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────
function boot() {
  // animated boot sequence
  const bootLines = [
    {t:'dim', s:'  Initializing ARHAT-OS...'},
    {t:'dim', s:'  Loading portfolio modules... ✓'},
    {t:'dim', s:'  Mounting /home/arhat... ✓'},
    {t:'dim', s:''},
  ];
  let i = 0;
  const bootInterval = setInterval(() => {
    if (i < bootLines.length) {
      print(bootLines[i].s, bootLines[i].t);
      i++;
    } else {
      clearInterval(bootInterval);
      printLines(T[lang].welcome);
    }
  }, 120);
}

boot();
inp.focus();
